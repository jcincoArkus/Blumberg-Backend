name: Build, Push to ECR & Deploy ECS - Develop

on:
  push:
    branches: [ "ci-cd/blum" ]
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch a desplegar (solo ci-cd/blum)"
        required: true
        default: "ci-cd/blum"
      run_nuke_and_pave:
        description: "Ejecutar nukeAndPave (borra BD, migra y siembra datos) contra la DB indicada en secretos"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_NAME: app
  SECRET_NAME: ci-cd-blumberg-dev
  AWS_REGION_DEFAULT: us-west-2

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: development

    env:
      AWS_ROLE_TO_ASSUME: arn:aws:iam::097659826120:role/github-oidc-deploy

    steps:
      - name: Validate manual dispatch branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.event.inputs.branch }}" != "ci-cd/blum" ]; then
            echo "Solo se permite ejecutar manualmente para branch: ci-cd/blum"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci-cd/blum

      - name: Install jq (safe)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract commit hash (short) and branch
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch_name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION_DEFAULT }}

      - name: Load config from Secrets Manager
        id: load-secret
        run: |
          set -euo pipefail

          SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_NAME" \
            --query SecretString \
            --output text)

          AWS_REGION=$(echo "$SECRET" | jq -r '.AWS_REGION')
          AWS_ACCOUNT_ID=$(echo "$SECRET" | jq -r '.AWS_ACCOUNT_ID')
          ECR_REPOSITORY_NAME=$(echo "$SECRET" | jq -r '.ECR_REPOSITORY_NAME')
          ECS_CLUSTER=$(echo "$SECRET" | jq -r '.ECS_CLUSTER')
          ECS_SERVICE=$(echo "$SECRET" | jq -r '.ECS_SERVICE')
          ECS_CONTAINER_NAME=$(echo "$SECRET" | jq -r '.ECS_CONTAINER_NAME')
          INGESTION_BASE_URL=$(echo "$SECRET" | jq -r '.INGESTION_SIMULATOR_BASE_URL // empty')
          INGESTION_API_KEY=$(echo "$SECRET" | jq -r '.INGESTION_SIMULATOR_API_KEY // empty')
          INGESTION_ORG_ID=$(echo "$SECRET" | jq -r '.INGESTION_SIMULATOR_ORG_ID // empty')
          if [ -n "$INGESTION_API_KEY" ]; then echo "::add-mask::$INGESTION_API_KEY"; fi

          echo "AWS_REGION=$AWS_REGION" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=$AWS_ACCOUNT_ID" >> $GITHUB_ENV
          echo "ECR_REPOSITORY_NAME=$ECR_REPOSITORY_NAME" >> $GITHUB_ENV
          echo "ECS_CLUSTER=$ECS_CLUSTER" >> $GITHUB_ENV
          echo "ECS_SERVICE=$ECS_SERVICE" >> $GITHUB_ENV
          echo "ECS_CONTAINER_NAME=$ECS_CONTAINER_NAME" >> $GITHUB_ENV
          echo "INGESTION_BASE_URL=$INGESTION_BASE_URL" >> $GITHUB_ENV
          echo "INGESTION_API_KEY=$INGESTION_API_KEY" >> $GITHUB_ENV
          echo "INGESTION_ORG_ID=$INGESTION_ORG_ID" >> $GITHUB_ENV

      - name: Ensure ECR repository exists (optional)
        run: |
          set -e
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY_NAME" --region "$AWS_REGION" >/dev/null

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: true

      - name: Build and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG_COMMIT: ${{ steps.vars.outputs.short_sha }}
          IMAGE_TAG_BRANCH: ${{ steps.vars.outputs.branch_name }}
        run: |
          set -euo pipefail
          echo "Repo ECR: $ECR_REGISTRY/$ECR_REPOSITORY_NAME"

          docker buildx build \
            --platform linux/amd64 \
            --file "$DOCKERFILE_PATH" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG_COMMIT" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG_BRANCH" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY_NAME:latest" \
            --push \
            .

          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY_NAME:$IMAGE_TAG_COMMIT" >> $GITHUB_OUTPUT

      - name: Register new ECS task definition revision (commit-based image)
        id: register-task-def
        run: |
          set -euo pipefail

          NEW_IMAGE="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY_NAME}:${{ steps.vars.outputs.short_sha }}"
          echo "ECS_CONTAINER_NAME: $ECS_CONTAINER_NAME"
          echo "Using new image: $NEW_IMAGE"

          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].taskDefinition" \
            --output text \
            --region "$AWS_REGION")

          echo "Current task definition: $TASK_DEF_ARN"

          TASK_DEF_JSON=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION")

          # Build a new task definition JSON:
          # - Always includes executionRoleArn
          # - Includes taskRoleArn only if present
          # - Prevents null arrays for volumes/placementConstraints
          NEW_TASK_DEF=$(echo "$TASK_DEF_JSON" | \
            jq --arg IMAGE "$NEW_IMAGE" \
               --arg CONTAINER "$ECS_CONTAINER_NAME" '
              .taskDefinition
              | .containerDefinitions |= map(
                  if .name == $CONTAINER then
                    .image = $IMAGE
                  else
                    .
                  end
                )
              | {
                  family,
                  executionRoleArn,
                  networkMode,
                  containerDefinitions,
                  requiresCompatibilities,
                  cpu,
                  memory,
                  volumes: (.volumes // []),
                  placementConstraints: (.placementConstraints // [])
                }
              + (if .taskRoleArn? != null then { taskRoleArn: .taskRoleArn } else {} end)
            ')

          echo "$NEW_TASK_DEF" > task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text \
            --region "$AWS_REGION")

          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> $GITHUB_OUTPUT
          echo "Registered new task definition: $NEW_TASK_DEF_ARN"

      - name: Update ECS service to new task definition
        run: |
          set -euo pipefail
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --force-new-deployment \
            --region "$AWS_REGION"

      # Solo si ejecutas manualmente con "Run nuke and pave" = true.
      # Lanza una tarea ECS usando la *misma task definition* que la API, pero sobreescribiendo el comando del contenedor
      # para ejecutar el CLI: dotnet /app/cli/CLI.dll nukeAndPave. La tarea corre en la misma VPC/subnets que el servicio
      # y hereda las variables de entorno de DB (DB_HOST, DB_NAME, etc.) ya configuradas en ECS.
      - name: Run nukeAndPave task in ECS (drop DB, migrate, seed)
        id: nuke-and-pave
        if: true
        run: |
          set -euo pipefail

          TASK_DEF_ARN="${{ steps.register-task-def.outputs.task_def_arn }}"
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].name' \
            --output text)
          echo "Container name from task definition: $CONTAINER_NAME"

          echo "Describiendo servicio ECS $ECS_SERVICE en cluster $ECS_CLUSTER..."
          SERVICE_DESC=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")

          LAUNCH_TYPE=$(echo "$SERVICE_DESC" | jq -r '.services[0].launchType // "FARGATE"')
          NETWORK_CONF=$(echo "$SERVICE_DESC" | jq -r '.services[0].networkConfiguration | @json')

          echo "Launch type del servicio: $LAUNCH_TYPE"
          echo "Network configuration: $NETWORK_CONF"

          # Override command so the container runs CLI (nukeAndPave). Image uses ENTRYPOINT ["dotnet"] CMD ["API.dll"] so this becomes: dotnet /app/cli/CLI.dll nukeAndPave
          OVERRIDES=$(jq -n --arg name "$CONTAINER_NAME" '
            {
              containerOverrides: [
                {
                  name: $name,
                  command: ["/app/cli/CLI.dll", "nukeAndPave"]
                }
              ]
            }')

          echo "Lanzando tarea ECS con task definition ${{ steps.register-task-def.outputs.task_def_arn }}..."
          RUN_RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "${{ steps.register-task-def.outputs.task_def_arn }}" \
            --launch-type "$LAUNCH_TYPE" \
            --network-configuration "$NETWORK_CONF" \
            --overrides "$OVERRIDES" \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$RUN_RESULT" ] || [ "$RUN_RESULT" = "None" ]; then
            echo "::error::run-task no devolvió taskArn (revisar permisos o capacidad del cluster)"
            exit 1
          fi

          TASK_ARN="$RUN_RESULT"
          echo "Tarea lanzada: $TASK_ARN — esperando que termine..."
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

          TASK_JSON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION")
          STOP_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].stopCode // "unknown"')
          STOP_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].stoppedReason // ""')
          EXIT_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].exitCode // "null"')
          EXIT_CODE_REASON=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].reason // ""')

          echo "stopCode: $STOP_CODE | stoppedReason: $STOP_REASON | exitCode: $EXIT_CODE | reason: $EXIT_CODE_REASON"

          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "null" ]; then
            echo "::error::nukeAndPave falló (exitCode=$EXIT_CODE). Revisa CloudWatch Logs del grupo del contenedor para ver el error (ej. DB_HOST/DB_PASSWORD en la task definition)."
            exit 1
          fi
          if [ "$STOP_CODE" != "EssentialContainerExited" ] && [ "$STOP_CODE" != "UserInitiated" ]; then
            echo "::error::Tarea detenida inesperadamente: stopCode=$STOP_CODE, reason=$STOP_REASON"
            exit 1
          fi
          echo "nukeAndPave completó correctamente."

      # Ejecuta ingestion:simulate solo si nukeAndPave terminó bien. BASE_URL por defecto: CloudFront de la API (se puede sobreescribir con INGESTION_SIMULATOR_BASE_URL en el secreto).
      - name: Run ingestion:simulate task in ECS (after nukeAndPave)
        id: ingestion-simulate
        if: steps.nuke-and-pave.outcome == 'success'
        run: |
          set -euo pipefail

          BASE_URL="${INGESTION_BASE_URL:-https://d2cqcx3hu6v090.cloudfront.net}"
          echo "Using API base URL: $BASE_URL"

          TASK_DEF_ARN="${{ steps.register-task-def.outputs.task_def_arn }}"
          CONTAINER_NAME=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].name' \
            --output text)

          SERVICE_DESC=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")
          LAUNCH_TYPE=$(echo "$SERVICE_DESC" | jq -r '.services[0].launchType // "FARGATE"')
          NETWORK_CONF=$(echo "$SERVICE_DESC" | jq -r '.services[0].networkConfiguration | @json')

          OVERRIDES=$(jq -n \
            --arg name "$CONTAINER_NAME" \
            --arg base_url "$BASE_URL" \
            --arg api_key "${INGESTION_API_KEY:-}" \
            --arg org_id "${INGESTION_ORG_ID:-}" \
            '{
              containerOverrides: [{
                name: $name,
                command: ["/app/cli/CLI.dll", "ingestion:simulate", "--batches", "2"],
                environment: (
                  [{ name: "INGESTION_SIMULATOR_BASE_URL", value: $base_url }]
                  + (if $api_key != "" then [{ name: "INGESTION_SIMULATOR_API_KEY", value: $api_key }] else [] end)
                  + (if $org_id != "" then [{ name: "INGESTION_SIMULATOR_ORG_ID", value: $org_id }] else [] end)
                )
              }]
            }')

          echo "Lanzando tarea ingestion:simulate (2 batches)..."
          RUN_RESULT=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TASK_DEF_ARN" \
            --launch-type "$LAUNCH_TYPE" \
            --network-configuration "$NETWORK_CONF" \
            --overrides "$OVERRIDES" \
            --region "$AWS_REGION" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$RUN_RESULT" ] || [ "$RUN_RESULT" = "None" ]; then
            echo "::error::run-task ingestion:simulate no devolvió taskArn"
            exit 1
          fi

          TASK_ARN="$RUN_RESULT"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION"

          TASK_JSON=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" --region "$AWS_REGION")
          EXIT_CODE=$(echo "$TASK_JSON" | jq -r '.tasks[0].containers[0].exitCode // "null"')
          echo "ingestion:simulate exitCode: $EXIT_CODE"
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "null" ]; then
            echo "::error::ingestion:simulate falló (exitCode=$EXIT_CODE). Revisa CloudWatch Logs de la tarea."
            exit 1
          fi
          echo "ingestion:simulate completó correctamente."

      - name: Summary
        run: |
          echo "## 🐳 Docker Image Built & Pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image (commit):** \`${{ steps.build-image.outputs.image_uri }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 ECS Deployment" >> $GITHUB_STEP_SUMMARY
          echo "**Cluster:** \`$ECS_CLUSTER\`" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** \`$ECS_SERVICE\`" >> $GITHUB_STEP_SUMMARY
          echo "**Task Definition:** \`${{ steps.register-task-def.outputs.task_def_arn }}\`" >> $GITHUB_STEP_SUMMARY
