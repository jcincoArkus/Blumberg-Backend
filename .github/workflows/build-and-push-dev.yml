name: Build Docker Image (no AWS)

on:
  push:
    branches: ["ci-cd/blum"]

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch a ejecutar (solo ci-cd/blum)"
        required: true
        default: "ci-cd/blum"

permissions:
  contents: read

env:
  DOCKERFILE_PATH: ./Dockerfile
  IMAGE_NAME: app

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Validate manual dispatch branch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [ "${{ github.event.inputs.branch }}" != "ci-cd/blum" ]; then
            echo "Solo se permite ejecutar manualmente para branch: ci-cd/blum"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ci-cd/blum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract commit hash (short) and branch
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "branch_name=$(echo ${GITHUB_REF#refs/heads/} | sed 's/\//-/g')" >> $GITHUB_OUTPUT

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          platforms: linux/amd64
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.branch_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## 🐳 Docker Image Build (sin AWS)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ steps.vars.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags generados:**" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE_NAME}:${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE_NAME}:${{ steps.vars.outputs.branch_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${IMAGE_NAME}:latest\`" >> $GITHUB_STEP_SUMMARY