# Casbin RBAC Model Configuration
# This model defines role-based access control with resource and action permissions

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = (r.sub == p.sub || g(r.sub, p.sub)) && (r.obj == p.obj || p.obj == r.obj + ":*" || keyMatch(r.obj, p.obj)) && r.act == p.act

