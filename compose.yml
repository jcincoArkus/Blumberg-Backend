name: blumberg

services:
  database:
    image: postgres:17
    container_name: blumberg_database
    hostname: postgres
    restart: unless-stopped
    ports:
      - 15432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB: blumberg
      POSTGRES_USER: blumberg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blumberg -d blumberg"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blumberg_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 5000:5000
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:5000
      DB_HOST: postgres
      DB_PORT: 5432

networks:
  default:
    name: blumberg

volumes:
  postgres:

